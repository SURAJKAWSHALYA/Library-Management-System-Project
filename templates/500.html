{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="container-fluid d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="text-center">
        <div style="font-size: 5rem; color: #f5576c; margin-bottom: 1rem;">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h1 style="font-size: 3rem; font-weight: 700; margin-bottom: 1rem;">500</h1>
        <h2 style="font-size: 1.5rem; margin-bottom: 1rem;">Server Error</h2>
        <p style="font-size: 1.1rem; color: #666; margin-bottom: 2rem;">
            Something went wrong on our end. Please try again later.
        </p>
        <div>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary me-2">
                <i class="fas fa-home"></i> Go to Dashboard
            </a>
            <a href="{{ url_for('index') }}" class="btn btn-outline-primary">
                <i class="fas fa-redo"></i> Refresh Page
            </a>
        </div>
    </div>
</div>
{% endblock %}
