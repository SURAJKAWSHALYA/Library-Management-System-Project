{% extends "base.html" %}

{% block title %}Edit Book - Library Management System{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="page-header">
        <a href="{{ url_for('view_books') }}" class="btn btn-outline-secondary mb-3">
            <i class="fas fa-arrow-left"></i> Back to Books
        </a>
        <h1><i class="fas fa-edit"></i> Edit Book</h1>
        <p class="text-muted">Update book information</p>
    </div>

    <div class="row">
        <div class="col-lg-8">
            {% if book %}
            <div class="content-card">
                <div class="card-header">
                    <h5>Book Details</h5>
                </div>
                <div class="card-body">
                    <form method="POST" class="needs-validation">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="title" class="form-label">Book Title <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="title" name="title" required value="{{ book['title'] }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="author" class="form-label">Author <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="author" name="author" required value="{{ book['author'] }}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="category" name="category" required value="{{ book['category'] }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="quantity" class="form-label">Quantity <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="quantity" name="quantity" required min="0" value="{{ book['quantity'] }}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="isbn" class="form-label">ISBN</label>
                                <input type="text" class="form-control" id="isbn" name="isbn" value="{{ book['isbn'] or '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="publisher" class="form-label">Publisher</label>
                                <input type="text" class="form-control" id="publisher" name="publisher" value="{{ book['publisher'] or '' }}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="year_published" class="form-label">Year Published</label>
                                <input type="number" class="form-control" id="year_published" name="year_published" value="{{ book['year_published'] or '' }}" min="1000" max="2099">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="4">{{ book['description'] or '' }}</textarea>
                        </div>

                        <div class="d-flex gap-2 pt-3">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                            <a href="{{ url_for('view_books') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
            {% else %}
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i> Book not found
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
