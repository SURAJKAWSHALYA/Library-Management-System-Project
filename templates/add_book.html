<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>➕ Add New Book</h1>
            <p>Add a book to your library collection</p>
        </header>

        <nav class="navbar">
            <a href="/" class="btn btn-secondary">Home</a>
            <a href="/books" class="btn btn-secondary">View Books</a>
        </nav>

        <main>
            <section class="form-section">
                <form method="POST" class="book-form">
                    <div class="form-group">
                        <label for="title">Book Title *</label>
                        <input type="text" id="title" name="title" required placeholder="Enter book title" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="author">Author *</label>
                        <input type="text" id="author" name="author" required placeholder="Enter author name" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="isbn">ISBN</label>
                        <input type="text" id="isbn" name="isbn" placeholder="Enter ISBN (13 digits)" class="form-control" maxlength="13">
                    </div>

                    <div class="form-group">
                        <label for="year_published">Year Published</label>
                        <input type="number" id="year_published" name="year_published" placeholder="Enter publication year" class="form-control" min="1000" max="2099">
                    </div>

                    <div class="form-group">
                        <label for="quantity">Quantity *</label>
                        <input type="number" id="quantity" name="quantity" required placeholder="Enter quantity" class="form-control" min="1" value="1">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">Add Book</button>
                        <a href="/books" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Library Management System. All rights reserved.</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
