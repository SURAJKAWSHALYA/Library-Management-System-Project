<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book - Library Management System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-bs-theme="light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom sticky-top" id="main-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <span class="fs-5">📚 Library Management</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/books">Books</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('add_book') }}">Add Book</a>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-secondary ms-2" id="theme-toggle" title="Toggle Dark Mode">
                            <i class="bi bi-moon-fill"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="py-4">
        <div class="container">
            <!-- Page Header with Back Button -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <a href="/books" class="btn btn-outline-secondary" title="Go Back">
                            <i class="bi bi-arrow-left"></i> Back
                        </a>
                        <div>
                            <h1 class="mb-0">➕ Add New Book</h1>
                            <p class="text-muted mb-0">Add a book to your library collection</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Form Section -->
            <div class="row">
                <div class="col-lg-6 mx-auto">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4">
                            <form method="POST" class="book-form">
                                <div class="mb-3">
                                    <label for="title" class="form-label"><i class="bi bi-book"></i> Book Title <span class="text-danger">*</span></label>
                                    <input type="text" id="title" name="title" required placeholder="Enter book title" class="form-control" autocomplete="off">
                                </div>

                                <div class="mb-3">
                                    <label for="author" class="form-label"><i class="bi bi-person"></i> Author <span class="text-danger">*</span></label>
                                    <input type="text" id="author" name="author" required placeholder="Enter author name" class="form-control" autocomplete="off">
                                </div>

                                <div class="mb-3">
                                    <label for="isbn" class="form-label"><i class="bi bi-barcode"></i> ISBN</label>
                                    <input type="text" id="isbn" name="isbn" placeholder="Enter ISBN (13 digits)" class="form-control" maxlength="13" autocomplete="off">
                                </div>

                                <div class="mb-3">
                                    <label for="year_published" class="form-label"><i class="bi bi-calendar"></i> Year Published</label>
                                    <input type="number" id="year_published" name="year_published" placeholder="Enter publication year" class="form-control" min="1000" max="2099">
                                </div>

                                <div class="mb-3">
                                    <label for="quantity" class="form-label"><i class="bi bi-box"></i> Quantity <span class="text-danger">*</span></label>
                                    <input type="number" id="quantity" name="quantity" required placeholder="Enter quantity" class="form-control" min="1" value="1">
                                </div>

                                <div class="d-grid gap-2 d-sm-flex">
                                    <button type="submit" class="btn btn-success"><i class="bi bi-check"></i> Add Book</button>
                                    <a href="/books" class="btn btn-secondary"><i class="bi bi-x"></i> Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light border-top mt-5 py-4">
        <div class="container text-center">
            <p class="text-muted mb-0">&copy; 2026 Library Management System. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
